<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suhana Khan — B.Tech CSE (AI & ML) | Field Notebook & Portfolio</title>
  
  <!-- Google Fonts: Fraunces & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            parchment: {
              50: '#FAF8F4',
              100: '#F9F6F0',
              200: '#F3EFE6',
              300: '#E7DFD2',
              400: '#D5C9B8',
              card: '#FFFDF9',
            },
            forest: {
              50: '#EAF3ED',
              100: '#CFE6D7',
              200: '#9FC9AF',
              400: '#4D8A66',
              600: '#26543C',
              700: '#1F4232',
              800: '#173427',
              900: '#10241B',
            },
            ochre: {
              50: '#FDF8ED',
              100: '#F9EED4',
              200: '#F3DC9F',
              300: '#E7C365',
              400: '#D8A63D',
              500: '#C68A35',
              600: '#A76F26',
              700: '#83541E',
            },
            night: {
              bg: '#121714',
              card: '#1A211D',
              elevated: '#222B26',
              border: '#2A362F',
              text: '#EDE8DF',
              muted: '#9CA79E',
            }
          },
          fontFamily: {
            serif: ['Fraunces', 'Playfair Display', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'notebook': '0 4px 20px -2px rgba(28, 36, 30, 0.06), 0 2px 6px -1px rgba(28, 36, 30, 0.04)',
            'notebook-hover': '0 14px 30px -4px rgba(28, 36, 30, 0.1), 0 6px 12px -2px rgba(28, 36, 30, 0.05)',
            'dark-notebook': '0 4px 20px -2px rgba(0, 0, 0, 0.4), 0 2px 6px -1px rgba(0, 0, 0, 0.2)',
            'dark-hover': '0 14px 30px -4px rgba(0, 0, 0, 0.6), 0 6px 12px -2px rgba(0, 0, 0, 0.3)',
          }
        }
      }
    }
  </script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .font-serif {
      font-family: 'Fraunces', 'Playfair Display', serif;
    }

    /* Tactile Archival Paper Texture Overlay (Zero performance overhead SVG fractal noise) */
    .paper-grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 40;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    .dark .paper-grain-overlay {
      opacity: 0.05;
      mix-blend-mode: overlay;
    }

    /* Living Organic Gradient Drift Keyframes */
    @keyframes blob-drift-1 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      33% {
        transform: translate3d(35px, -28px, 0) scale(1.08) rotate(4deg);
      }
      66% {
        transform: translate3d(-24px, 22px, 0) scale(0.94) rotate(-3deg);
      }
    }

    @keyframes blob-drift-2 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      40% {
        transform: translate3d(-38px, 32px, 0) scale(1.06) rotate(-5deg);
      }
      75% {
        transform: translate3d(28px, -18px, 0) scale(0.96) rotate(3deg);
      }
    }

    @keyframes blob-drift-3 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(24px, 32px, 0) scale(1.07);
      }
    }

    @keyframes blob-drift-4 {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate3d(-25px, -25px, 0) scale(1.05) rotate(4deg);
      }
    }

    .animate-blob-1 {
      animation: blob-drift-1 26s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }
    .animate-blob-2 {
      animation: blob-drift-2 32s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }
    .animate-blob-3 {
      animation: blob-drift-3 28s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }
    .animate-blob-4 {
      animation: blob-drift-4 34s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    /* Ambient Warm Specular Light Sweep Across Hero */
    @keyframes light-sweep {
      0% {
        transform: translateX(-120%) rotate(25deg);
        opacity: 0;
      }
      20% {
        opacity: 0.06;
      }
      50% {
        opacity: 0.08;
      }
      80% {
        opacity: 0.05;
      }
      100% {
        transform: translateX(220%) rotate(25deg);
        opacity: 0;
      }
    }
    .animate-light-sweep {
      animation: light-sweep 24s ease-in-out infinite;
      will-change: transform, opacity;
    }

    /* Botanical Line-Art Gentle Floating & Breathing */
    @keyframes botanical-float {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0.28;
      }
      50% {
        transform: translate3d(0, -9px, 0) rotate(2.5deg);
        opacity: 0.44;
      }
    }
    .animate-botanical-float {
      animation: botanical-float 16s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes botanical-sway {
      0%, 100% {
        transform: rotate(0deg) translate3d(0, 0, 0);
        opacity: 0.25;
      }
      50% {
        transform: rotate(-3deg) translate3d(-4px, -6px, 0);
        opacity: 0.38;
      }
    }
    .animate-botanical-sway {
      animation: botanical-sway 18s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    /* Extremely Subtle Floating Botanical Motes / Spores */
    @keyframes mote-drift-1 {
      0%, 100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.25;
      }
      50% {
        transform: translate3d(14px, -28px, 0);
        opacity: 0.65;
      }
    }
    @keyframes mote-drift-2 {
      0%, 100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.2;
      }
      50% {
        transform: translate3d(-16px, -22px, 0);
        opacity: 0.6;
      }
    }
    @keyframes mote-drift-3 {
      0%, 100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.22;
      }
      50% {
        transform: translate3d(10px, -32px, 0);
        opacity: 0.55;
      }
    }
    .animate-mote-1 { animation: mote-drift-1 14s ease-in-out infinite alternate; }
    .animate-mote-2 { animation: mote-drift-2 18s ease-in-out infinite alternate; }
    .animate-mote-3 { animation: mote-drift-3 16s ease-in-out infinite alternate; }

    /* Field Notebook Dynamic Dot Grid in Skills Section */
    .field-dot-grid {
      background-image: radial-gradient(rgba(31, 66, 50, 0.08) 1.2px, transparent 1.2px);
      background-size: 26px 26px;
      animation: grid-drift 45s linear infinite;
    }
    .dark .field-dot-grid {
      background-image: radial-gradient(rgba(52, 211, 153, 0.08) 1.2px, transparent 1.2px);
      background-size: 26px 26px;
    }
    @keyframes grid-drift {
      0% { background-position: 0 0; }
      100% { background-position: 26px 26px; }
    }

    /* Soft Glow Breathing for Contact Section */
    @keyframes contact-glow-pulse {
      0%, 100% {
        transform: scale(1) translate3d(0, 0, 0);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.1) translate3d(10px, -8px, 0);
        opacity: 0.6;
      }
    }
    .animate-contact-glow {
      animation: contact-glow-pulse 16s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    /* Card Micro-Interaction Enhancements */
    .field-card {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .field-card:hover {
      transform: translateY(-3px);
    }

    .btn-tactile {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background-color 0.2s ease;
    }
    .btn-tactile:hover {
      transform: translateY(-2px);
    }
    .btn-tactile:active {
      transform: translateY(0px);
    }

    /* Scroll Reveal Baseline */
    .reveal-item {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-item.is-revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Strict Accessibility: prefers-reduced-motion: reduce */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .animate-blob-1, .animate-blob-2, .animate-blob-3, .animate-blob-4,
      .animate-light-sweep, .animate-botanical-float, .animate-botanical-sway,
      .animate-mote-1, .animate-mote-2, .animate-mote-3, .field-dot-grid,
      .animate-contact-glow {
        animation: none !important;
        transform: none !important;
      }
      .reveal-item {
        opacity: 1 !important;
        transform: none !important;
      }
      .field-card:hover, .btn-tactile:hover {
        transform: none !important;
      }
    }
  </style>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-parchment-100 text-[#1C241E] dark:bg-night-bg dark:text-night-text antialiased transition-colors duration-300 relative selection:bg-ochre-200 dark:selection:bg-forest-900 selection:text-forest-900 dark:selection:text-emerald-200">
  
  <!-- Tactile Archival Paper Grain Filter Overlay -->
  <div class="paper-grain-overlay" aria-hidden="true"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Signature Leaf SVG Motif
    function LeafIcon({ className = "w-5 h-5", strokeWidth = 1.6 }) {
      return (
        <svg 
          className={className} 
          viewBox="0 0 24 24" 
          fill="none" 
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path 
            d="M12 21C7 21 4 17 4 12C4 7 8 3 19 3C19 14 17 21 12 21Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
            strokeLinejoin="round"
          />
          <path 
            d="M6.5 17.5L19 3" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round"
          />
          <path 
            d="M10.5 13.5L13.5 16" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round"
          />
          <path 
            d="M13.5 10.5L16.5 13" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round"
          />
        </svg>
      );
    }

    // Delicate botanical sprig line-art for atmospheric section edges
    function BotanicalSprig({ className = "w-36 h-36", strokeWidth = 1.2 }) {
      return (
        <svg 
          className={className} 
          viewBox="0 0 100 100" 
          fill="none" 
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path 
            d="M15 85 C 35 70, 50 45, 80 18" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
          />
          {/* Leaf 1 */}
          <path 
            d="M38 62 C 34 52, 25 50, 22 55 C 26 64, 34 64, 38 62 Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
            strokeLinejoin="round" 
          />
          {/* Leaf 2 */}
          <path 
            d="M48 51 C 55 44, 63 46, 64 53 C 58 57, 50 56, 48 51 Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
            strokeLinejoin="round" 
          />
          {/* Leaf 3 */}
          <path 
            d="M62 37 C 58 28, 48 29, 47 36 C 53 41, 60 40, 62 37 Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
            strokeLinejoin="round" 
          />
          {/* Terminal bud */}
          <path 
            d="M80 18 C 77 12, 70 14, 71 21 C 76 23, 80 21, 80 18 Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
          />
        </svg>
      );
    }

    // Archival botanical corner embellishment
    function BotanicalCorner({ className = "w-24 h-24", strokeWidth = 1.2 }) {
      return (
        <svg 
          className={className} 
          viewBox="0 0 60 60" 
          fill="none" 
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path 
            d="M6 54 C 18 36, 36 18, 54 6" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
          />
          <path 
            d="M24 36 C 20 28, 14 30, 16 38 C 22 40, 24 38, 24 36 Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
          />
          <path 
            d="M38 22 C 44 16, 42 10, 36 12 C 34 18, 36 22, 38 22 Z" 
            stroke="currentColor" 
            strokeWidth={strokeWidth} 
            strokeLinecap="round" 
          />
        </svg>
      );
    }

    function LeafDivider({ className = "my-12" }) {
      return (
        <div className={`flex items-center justify-center gap-4 ${className}`} aria-hidden="true">
          <div className="h-px bg-gradient-to-r from-transparent via-forest-700/25 to-forest-700/40 dark:via-night-border dark:to-emerald-500/30 flex-1 max-w-xs"></div>
          <LeafIcon className="w-4 h-4 text-ochre-500 dark:text-ochre-400 rotate-45 transform" strokeWidth={1.5} />
          <div className="h-px bg-gradient-to-l from-transparent via-forest-700/25 to-forest-700/40 dark:via-night-border dark:to-emerald-500/30 flex-1 max-w-xs"></div>
        </div>
      );
    }

    // Floating Ambient Organic Shapes System (Placed across page depth)
    function AmbientBackgroundShapes({ scrollY }) {
      const prefersReducedMotion = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const parallaxOffset = prefersReducedMotion ? 0 : scrollY * 0.08;

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden -z-10" aria-hidden="true">
          
          {/* Shape 1: Deep Botanical Green (Upper Left) */}
          <div 
            style={{ transform: `translate3d(0, ${-parallaxOffset * 0.9}px, 0)` }}
            className="absolute -top-[10%] -left-[10%] w-[580px] h-[580px] rounded-[45%_55%_65%_35%/50%_45%_55%_50%] bg-gradient-to-br from-forest-700/[0.07] via-forest-600/[0.04] to-transparent dark:from-emerald-950/25 dark:via-emerald-900/10 dark:to-transparent blur-[95px] animate-blob-1"
          />

          {/* Shape 2: Warm Ochre Gold (Upper Right Behind Hero/Photo) */}
          <div 
            style={{ transform: `translate3d(0, ${-parallaxOffset * 1.1}px, 0)` }}
            className="absolute top-[8%] -right-[8%] w-[520px] h-[520px] rounded-[60%_40%_35%_65%/55%_35%_65%_45%] bg-gradient-to-tl from-ochre-400/[0.08] via-ochre-500/[0.04] to-transparent dark:from-amber-950/25 dark:via-ochre-900/10 dark:to-transparent blur-[90px] animate-blob-2"
          />

          {/* Shape 3: Soft Sage & Cream Glow (Midpage Behind Skills/Projects) */}
          <div 
            style={{ transform: `translate3d(0, ${-parallaxOffset * 0.6}px, 0)` }}
            className="absolute top-[48%] -left-[12%] w-[640px] h-[640px] rounded-[40%_60%_50%_50%/45%_55%_45%_55%] bg-gradient-to-tr from-forest-700/[0.05] via-ochre-100/[0.03] to-transparent dark:from-forest-900/15 dark:via-night-elevated/40 dark:to-transparent blur-[110px] animate-blob-3"
          />

          {/* Shape 4: Warm Nocturne Amber/Gold (Lower Page Behind Contact) */}
          <div 
            style={{ transform: `translate3d(0, ${-parallaxOffset * 0.7}px, 0)` }}
            className="absolute -bottom-[10%] right-[10%] w-[560px] h-[560px] rounded-[50%_50%_60%_40%/40%_60%_40%_60%] bg-gradient-to-bl from-ochre-500/[0.07] via-forest-600/[0.03] to-transparent dark:from-amber-950/20 dark:via-emerald-950/15 dark:to-transparent blur-[100px] animate-blob-4"
          />

        </div>
      );
    }

    // Navbar Component
    function Navbar({ darkMode, setDarkMode }) {
      const [scrolled, setScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { name: "About", href: "#about" },
        { name: "Skills", href: "#skills" },
        { name: "Projects", href: "#projects" },
        { name: "Contact", href: "#contact" },
      ];

      return (
        <header 
          className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${
            scrolled 
              ? 'bg-parchment-100/92 dark:bg-night-bg/92 backdrop-blur-md shadow-sm border-b border-forest-700/10 dark:border-night-border py-3' 
              : 'bg-transparent py-5'
          }`}
        >
          <div className="max-w-6xl mx-auto px-6 sm:px-8 flex items-center justify-between">
            <a 
              href="#" 
              id="brand-logo"
              className="group flex items-center gap-2.5 text-forest-800 dark:text-parchment-100 font-serif font-semibold text-lg tracking-tight hover:text-ochre-600 dark:hover:text-ochre-400 transition-colors"
            >
              <span className="p-1.5 rounded-lg bg-forest-700/10 dark:bg-forest-400/10 text-forest-700 dark:text-forest-200 group-hover:rotate-12 transition-transform duration-300">
                <LeafIcon className="w-4 h-4" />
              </span>
              <span className="tracking-wide">Suhana Khan</span>
              <span className="text-xs uppercase tracking-widest font-sans font-medium px-2 py-0.5 rounded-full bg-forest-700/5 dark:bg-night-elevated text-forest-700 dark:text-forest-200 border border-forest-700/15 dark:border-night-border hidden sm:inline-block">
                AI & ML
              </span>
            </a>

            <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-forest-900/80 dark:text-night-text">
              {navLinks.map((link) => (
                <a
                  key={link.name}
                  href={link.href}
                  className="relative py-1 hover:text-ochre-600 dark:hover:text-ochre-400 transition-colors after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-0 after:h-0.5 after:bg-ochre-500 hover:after:w-full after:transition-all after:duration-300"
                >
                  {link.name}
                </a>
              ))}

              <button
                onClick={() => setDarkMode(!darkMode)}
                id="theme-toggle-btn"
                className="p-2 rounded-lg bg-parchment-200/80 dark:bg-night-elevated text-forest-800 dark:text-ochre-300 hover:bg-parchment-300 dark:hover:bg-night-border transition-all border border-forest-700/15 dark:border-night-border flex items-center justify-center cursor-pointer btn-tactile"
                title={darkMode ? "Switch to light mode" : "Switch to dark mode"}
                aria-label="Toggle theme"
              >
                {darkMode ? (
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                ) : (
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                  </svg>
                )}
              </button>
            </nav>

            <div className="flex md:hidden items-center gap-3">
              <button
                onClick={() => setDarkMode(!darkMode)}
                id="mobile-theme-toggle"
                className="p-2 rounded-lg bg-parchment-200/80 dark:bg-night-elevated text-forest-800 dark:text-ochre-300 border border-forest-700/15 dark:border-night-border btn-tactile"
              >
                {darkMode ? "☀️" : "🌙"}
              </button>
              <button
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                id="mobile-menu-btn"
                className="p-2 rounded-lg bg-parchment-200/80 dark:bg-night-elevated text-forest-800 dark:text-night-text border border-forest-700/15 dark:border-night-border"
              >
                {mobileMenuOpen ? "✕" : "☰"}
              </button>
            </div>
          </div>

          {mobileMenuOpen && (
            <div className="md:hidden bg-parchment-100/98 dark:bg-night-card/98 border-b border-forest-700/15 dark:border-night-border px-6 py-5 shadow-lg backdrop-blur-md">
              <div className="flex flex-col gap-4">
                {navLinks.map((link) => (
                  <a
                    key={link.name}
                    href={link.href}
                    onClick={() => setMobileMenuOpen(false)}
                    className="text-base font-medium text-forest-900 dark:text-night-text hover:text-ochre-600 dark:hover:text-ochre-400 py-1"
                  >
                    {link.name}
                  </a>
                ))}
              </div>
            </div>
          )}
        </header>

                  id="resume-download-btn"
                  className="w-full sm:w-auto inline-flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-xl bg-forest-700 hover:bg-forest-800 dark:bg-forest-600 dark:hover:bg-forest-700 text-parchment-50 font-medium text-sm tracking-wide shadow-md transition-all cursor-pointer btn-tactile"
                >
                  <span>Download Resume</span>
                  <span className="text-xs text-parchment-200/80 font-mono">(Summary)</span>
                </button>
              </div>

            </div>
          </div>
        </section>
      );
    }

    // Footer Component
    function Footer() {
      return (
        <footer className="py-12 border-t border-forest-700/10 dark:border-night-border relative text-xs text-forest-700/70 dark:text-night-muted">
          <div className="max-w-6xl mx-auto px-6 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <LeafIcon className="w-4 h-4 text-ochre-600 dark:text-ochre-400" />
              <span className="font-serif font-semibold text-forest-900 dark:text-night-text">
                Suhana Khan
              </span>
              <span>·</span>
              <span>B.Tech CSE (AI & ML)</span>
            </div>

            <div className="font-mono text-[11px] text-center">
              Field Notebook Edition · Crafted with React & Tailwind CSS
            </div>

            <div className="flex items-center gap-4">
              <a href="#" className="hover:text-ochre-600 dark:hover:text-ochre-400 transition-colors">
                Back to Top &uarr;
              </a>
              <span>&copy; {new Date().getFullYear()}</span>
            </div>
          </div>
        </footer>
      );
    }

    // Root App Component with Dark Mode & Scroll Parallax State
    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('suhana-portfolio-theme');
        if (saved !== null) return saved === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      const [scrollY, setScrollY] = useState(0);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('suhana-portfolio-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('suhana-portfolio-theme', 'light');
        }
      }, [darkMode]);

      // Highly performant passive scroll listener for subtle background parallax
      useEffect(() => {
        let ticking = false;
        const handleScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(() => {
              setScrollY(window.scrollY);
              ticking = false;
            });
            ticking = true;
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="min-h-screen bg-parchment-100 text-[#1C241E] dark:bg-night-bg dark:text-night-text transition-colors duration-300 relative">
          
          {/* Living Ambient Organic Shapes Layer */}
          <AmbientBackgroundShapes scrollY={scrollY} />

          {/* Navigation */}
          <Navbar darkMode={darkMode} setDarkMode={setDarkMode} />
          
          {/* Main Sections */}
          <main>
            <Hero scrollY={scrollY} />
            <About />
            <Skills />
            <Projects />
            <Contact />
          </main>

          {/* Footer */}
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
